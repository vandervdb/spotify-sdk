name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Publier seulement dans le dépôt local, sans rien envoyer"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publier sur Maven Central
    # macOS : les cibles iOS ne se compilent que là, et une publication partielle
    # laisserait des variantes manquantes dans les métadonnées Gradle.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Les modules Android exigent l'AAR App Remote, absent du dépôt.
      - uses: ./.github/actions/spotify-aar

      - name: Vérifier avant de publier
        run: |
          ./gradlew \
            :spotify-core:jvmTest :spotify-testing:jvmTest \
            :spotify-android:testDebugUnitTest \
            :spotify-android-testing:testDebugUnitTest \
            :spotify-android-koin:testDebugUnitTest \
            apiCheck --stacktrace

      - name: Répétition — publication locale uniquement
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Publier
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKey}" ]; then
            echo "::error::secret SIGNING_KEY absent — Maven Central refuse les artefacts non signés"
            exit 1
          fi
          # Sur un tag, la version vient du tag (v0.1.0 → 0.1.0) ; sinon le build reste en SNAPSHOT.
          VERSION_ARG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME invalide — attendu vX.Y.Z"
              exit 1
            fi
            VERSION_ARG="-PreleaseVersion=$VERSION"
          fi
          ./gradlew publishAndReleaseToMavenCentral $VERSION_ARG --no-configuration-cache --stacktrace
